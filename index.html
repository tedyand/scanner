<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Barcode iPhone</title>
    <!-- Memuat Library Scanner khusus Barcode Garis & Excel (CDN super ringan) -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; text-align: center; color: #212529; font-size: 18px;}
        
        /* Viewfinder Scanner */
        #scanner-container {
            width: 100%;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
            aspect-ratio: 4 / 3;
        }
        /* Memastikan video memenuhi area kotak */
        #scanner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Canvas bawaan library disembunyikan agar ringan */
        #scanner-container canvas.drawingBuffer {
            display: none;
        }
        
        .laser-line {
            position: absolute;
            top: 50%; left: 5%;
            width: 90%; height: 2px;
            background-color: #ff3b30;
            box-shadow: 0 0 8px #ff3b30;
            transform: translateY(-50%);
            z-index: 10;
        }

        .input-box { margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ced4da;
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        
        .row-btn { display: flex; gap: 8px; margin-top: 15px; }
        button {
            flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-add { background: #34c759; }
        .btn-xl { background: #007aff; }
        
        .log-box {
            margin-top: 15px; max-height: 120px; overflow-y: auto;
            border-top: 1px solid #dee2e6; padding-top: 8px; font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px dashed #f1f3f5; color: #666;}
    </style>
</head>
<body>

<div class="card">
    <h3>Barcode Scanner Multi-Parse</h3>
    
    <!-- Kotak Kamera Belakang -->
    <div id="scanner-container">
        <div class="laser-line"></div>
    </div>

    <div class="input-box">
        <label>Nama Barang</label>
        <input type="text" id="nama" value="iPhone 15 Pink">
    </div>
    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <input type="text" id="sn" placeholder="Menunggu scan barcode...">
    </div>
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" placeholder="Menunggu scan barcode...">
    </div>

    <div class="row-btn">
        <button class="btn-add" onclick="simpanData()">Simpan Data</button>
        <button class="btn-xl" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#333;">Data Antrean Saat Ini:</strong>
        <div id="log-list"></div>
    </div>
</div>

<script>
    let dbData = [];

    // Inisialisasi Kamera Belakang dengan Quagga2
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner-container'),
            constraints: {
                width: 640,
                height: 480,
                facingMode: "environment" // Paksa Wajib Kamera Belakang
            },
        },
        decoder: {
            // Membaca tipe barcode Code 128 dan Code 39 (tipe standar retail Apple)
            readers: ["code_128_reader", "code_39_reader"]
        },
        locate: true // Fitur pelacak lokasi garis barcode agar deteksi instan
    }, function(err) {
        if (err) {
            console.error(err);
            alert("Gagal memuat kamera belakang. Pastikan Anda membuka link HTTPS dan menyetujui izin kamera.");
            return;
        }
        console.log("Quagga berhasil dijalankan");
        Quagga.start();
    });

    // Deteksi Berhasil & Auto-Parsing
    Quagga.onDetected(function(result) {
        let code = result.codeResult.code;
        if (!code) return;

        let cleanText = code.trim();

        // 1. Ciri IMEI: Berisi 15 digit angka murni
        if (/^\d{15}$/.test(cleanText)) {
            document.getElementById('imei').value = cleanText;
            vibrateHP();
        } 
        // 2. Ciri Serial Number iPhone: Panjang 10-12 karakter alfanumerik campuran
        else if (cleanText.length >= 9 && cleanText.length <= 13 && !/\s/.test(cleanText)) {
            // Hilangkan emblem (S) bawaan cetakan barcode jika terbaca
            if(cleanText.toUpperCase().startsWith("S")) {
                cleanText = cleanText.substring(1);
            }
            document.getElementById('sn').value = cleanText;
            vibrateHP();
        }
    });

    function vibrateHP() {
        if (navigator.vibrate) navigator.vibrate(60);
    }

    function simpanData() {
        const nama = document.getElementById('nama').value;
        const sn = document.getElementById('sn').value;
        const imei = document.getElementById('imei').value;

        if (!sn && !imei) return alert("Data kosong, silakan lakukan scan barcode dahulu!");

        dbData.push({ "Nama Barang": nama, "Serial Number": sn, "IMEI": imei });

        const logList = document.getElementById('log-list');
        logList.innerHTML += `<div class="log-item">✓ SN: ${sn || '-'} | IMEI: ${imei || '-'}</div>`;
        logList.scrollTop = logList.scrollHeight;

        // Bersihkan kolom untuk perangkat berikutnya
        document.getElementById('sn').value = '';
        document.getElementById('imei').value = '';
    }

    function unduhExcel() {
        if (dbData.length === 0) return alert("Belum ada data antrean!");
        const ws = XLSX.utils.json_to_sheet(dbData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data Scan");
        XLSX.writeFile(wb, "Data_Scan_iPhone.xlsx");
    }
</script>

</body>
</html>
