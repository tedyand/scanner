<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner iPhone</title>
    
    <!-- Menghubungkan ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h3>iPhone Scanner Instan</h3>
    
    <div class="video-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="laser"></div>
    </div>

    <div class="input-box">
        <label>Asal Barang</label>
        <input type="text" id="asalBarang" placeholder="Nama Toko">
    </div>

    <div class="input-box">
        <label>Tipe Barang</label>
        <select id="tipeBarang">
            <option value="iPhone 15">iPhone 15</option>
            <option value="iPhone 16">iPhone 16</option>
            <option value="iPhone 17">iPhone 17</option>
            <option value="iPhone 18">iPhone 18</option>
        </select>
    </div>

    <div class="input-box">
        <label>Varian Barang</label>
        <select id="varianBarang">
            <option value="-">(Kosong)</option>
            <option value="Basic">Basic</option>
            <option value="Pro">Pro</option>
            <option value="Pro Max">Pro Max</option>
        </select>
    </div>

    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <div class="search-group">
            <input type="text" id="sn" maxlength="10" placeholder="Dekatkan kamera ke Barcode">
            <button type="button" class="btn-cek" id="btnCekSn" onclick="cekAppleCoverage()">CEK</button>
        </div>
        <div id="sn-error" class="error-msg">Serial Number harus diisi 10 karakter!</div>
    </div>
    
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" maxlength="15" placeholder="Otomatis terpisah">
        <div id="imei-error" class="error-msg">IMEI harus diisi 15 digit angka!</div>
    </div>

    <div class="row-btn">
        <button class="btn-add" id="btnSimpan" onclick="simpanData()">Simpan Data</button>
        <button class="btn-xl" id="btnExcel" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#1f2937;">Antrean Data Saat Ini:</strong>
        <div id="log-list"></div>
    </div>
</div>

<!-- Menghubungkan ke file JavaScript eksternal -->
<script src="script.js"></script>
</body>
</html>
