<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Cepat</title>
    <!-- MENGGANTI library pembaca ke ZXing Khusus Barcode Garis & QR (Sangat Akurat) -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; text-align: center; color: #212529; font-size: 16px;}
        
        /* Area Kotak Kamera Native (TETAP SAMA PERSIS) */
        .video-box {
            width: 100%;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            margin-bottom: 15px;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #hidden-canvas { display: none; }

        /* Garis Bidik Merah */
        .laser {
            position: absolute;
            top: 50%; left: 5%;
            width: 90%; height: 2px;
            background-color: #ff3b30;
            box-shadow: 0 0 6px #ff3b30;
            transform: translateY(-50%);
        }

        .input-box { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #495057; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ced4da;
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        
        .row-btn { display: flex; gap: 8px; margin-top: 15px; }
        button {
            flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-add { background: #34c759; }
        .btn-xl { background: #007aff; }
        
        .log-box {
            margin-top: 15px; max-height: 100px; overflow-y: auto;
            border-top: 1px solid #dee2e6; padding-top: 8px; font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px dashed #f1f3f5; color: #666;}
    </style>
</head>
<body>

<div class="card">
    <h3>Barcode Scanner Instan</h3>
    
    <!-- Tampilan Utama Kamera Belakang HP (STRUKTUR KAMERA AWAL ANDA) -->
    <div class="video-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="laser"></div>
    </div>

    <canvas id="hidden-canvas"></canvas>

    <div class="input-box">
        <label>Nama Barang</label>
        <input type="text" id="nama" value="iPhone 15 Pink">
    </div>
    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <input type="text" id="sn" placeholder="Dekatkan kamera ke Barcode">
    </div>
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" placeholder="Otomatis terpisah">
    </div>

    <div class="row-btn">
        <button class="btn-add" onclick="simpanData()">Simpan Data</button>
        <button class="btn-xl" id="btnExcel" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#333;">Antrean Data Saat Ini:</strong>
        <div id="log-list"></div>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvasElement = document.getElementById('hidden-canvas');
    const canvas = canvasElement.getContext('2d', { alpha: false });
    let dbData = [];
    
    // Inisialisasi pembaca multi-format ZXing (Mendukung Barcode 128 dan QR sekaligus)
    const codeReader = new ZXing.BrowserMultiFormatReader();

    // Mengaktifkan Kamera Belakang dengan Struktur yang Sudah Berhasil Sebelumnya (TIDAK DIRUBAH)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function(stream) {
        video.srcObject = stream;
        video.play().then(() => { requestAnimationFrame(prosesFrame); });
    })
    .catch(err => alert("Kamera Error: Pastikan menggunakan link HTTPS dan beri izin akses kamera."));

    function prosesFrame() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            
            try {
                // ZXing membaca gambar canvas aktif dari streaming video Anda secara real-time
                const result = codeReader.decodeFromCanvas(canvasElement);
                if (result && result.text) {
                    parseDataBarcode(result.text);
                }
            } catch (err) {
                // Abaikan error pencarian jika frame belum fokus menangkap garis barcode
            }
        }
        // Siklus pembacaan frame konstan diatur 150ms agar HP tidak lemot dan baterai awet
        setTimeout(() => { requestAnimationFrame(prosesFrame); }, 150); 
    }

    // MEMISAHKAN DATA SECARA OTOMATIS (TETAP SAMA)
    function parseDataBarcode(text) {
        let cleanText = text.trim();
        
        // Deteksi IMEI (15 digit angka murni)
        if (/^\d{15}$/.test(cleanText)) {
            document.getElementById('imei').value = cleanText;
            vibrateDevice();
        } 
        // Deteksi Serial Number iPhone (9-13 alfanumerik)
        else if (cleanText.length >= 9 && cleanText.length <= 13 && !/\s/.test(cleanText)) {
            if (cleanText.toUpperCase().startsWith("S")) {
                cleanText = cleanText.substring(1);
            }
            document.getElementById('sn').value = cleanText;
            vibrateDevice();
        }
    }

    function vibrateDevice() {
        if (navigator.vibrate) navigator.vibrate(40);
    }

    function simpanData() {
        const nama = document.getElementById('nama').value;
        const sn = document.getElementById('sn').value;
        const imei = document.getElementById('imei').value;

        if (!sn && !imei) return alert("Silakan scan barcode terlebih dahulu!");

        dbData.push({ "Nama Barang": nama, "Serial Number": sn, "IMEI": imei });

        const logList = document.getElementById('log-list');
        logList.innerHTML += `<div class="log-item">✓ SN: ${sn || '-'} | IMEI: ${imei || '-'}</div>`;
        logList.scrollTop = logList.scrollHeight;

        document.getElementById('sn').value = '';
        document.getElementById('imei').value = '';
    }

    // LAZY LOADING EXCEL (Tetap dipertahankan agar muat halaman kilat)
    function unduhExcel() {
        if (dbData.length === 0) return alert("Data antrean masih kosong!");
        
        const btn = document.getElementById('btnExcel');
        btn.innerText = "Memproses...";
        btn.disabled = true;

        if (window.XLSX) {
            prosesEkspor();
        } else {
            const script = document.createElement('script');
            script.src = "https://jsdelivr.net";
            script.onload = () => { prosesEkspor(); };
            document.head.appendChild(script);
        }
    }

    function prosesEkspor() {
        const ws = XLSX.utils.json_to_sheet(dbData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Data_Scan_iPhone.xlsx");
        
        const btn = document.getElementById('btnExcel');
        btn.innerText = "Unduh Excel";
        btn.disabled = false;
    }
</script>

</body>
</html>
