<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Barcode iPhone</title>
    <!-- Memuat Pustaka Scanner Terstabil -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; text-align: center; color: #212529; font-size: 16px;}
        
        /* Tombol Paksa Kamera */
        .btn-kamera-wajib {
            width: 100%;
            background-color: #ff9500;
            color: white;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #scanner-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
            margin-bottom: 15px;
            aspect-ratio: 4 / 3;
        }

        .input-box { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #495057; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ced4da;
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        
        .row-btn { display: flex; gap: 8px; margin-top: 15px; }
        button.action-btn {
            flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-add { background: #34c759; }
        .btn-xl { background: #007aff; }
        
        .log-box {
            margin-top: 15px; max-height: 100px; overflow-y: auto;
            border-top: 1px solid #dee2e6; padding-top: 8px; font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px dashed #f1f3f5; color: #666;}
        
        /* Sembunyikan elemen teks eror bawaan library agar tidak mengotori layar */
        #scanner-box button, #scanner-box span { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h3>Barcode Scanner Fail-Safe V2</h3>
    
    <!-- TOMBOL PAKSA MANUAL UNTUK MENYALAKAN KAMERA BELAKANG -->
    <button class="btn-kamera-wajib" onclick="hidupkanKameraManual()">🔴 KLIK DI SINI UNTUK NYALAKAN KAMERA</button>
    
    <!-- Area Viewfinder Kamera -->
    <div id="scanner-box"></div>

    <div class="input-box">
        <label>Nama Barang</label>
        <input type="text" id="nama" value="iPhone 15 Pink">
    </div>
    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <input type="text" id="sn" placeholder="Arahkan ke barcode garis">
    </div>
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" placeholder="Otomatis terpisah">
    </div>

    <div class="row-btn">
        <button class="action-btn btn-add" onclick="simpanData()">Simpan Data</button>
        <button class="action-btn btn-xl" id="btnExcel" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#333;">Antrean Data Saat Ini:</strong>
        <div id="log-list"></div>
    </div>
</div>

<script>
    let dbData = [];
    let lastScanned = "";
    let debounceTimer;
    let html5QrCode;

    // Buat objek scanner utama di awal
    try {
        html5QrCode = new Html5Qrcode("scanner-box", { 
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128, 
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13
            ] 
        });
    } catch(e) {
        console.log("Scanner ready");
    }

    // FUNGSI UTAMA: Memaksa browser HP meminta izin dan membuka kamera belakang
    function hidupkanKameraManual() {
        // Berhenti dulu jika sebelumnya ada proses kamera yang menggantung
        html5QrCode.stop().catch(() => {});

        // Jalankan perintah tembak kamera belakang langsung
        html5QrCode.start(
            { facingMode: "environment" }, 
            {
                fps: 15,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return { width: Math.floor(viewfinderWidth * 0.85), height: Math.floor(viewfinderHeight * 0.4) };
                },
                aspectRatio: 1.333333
            },
            onScanSuccess
        )
        .then(() => {
            // Ubah teks tombol jika berhasil menyala
            document.querySelector('.btn-kamera-wajib').innerText = "🔄 KAMERA AKTIF (Klik untuk Reset)";
            document.querySelector('.btn-kamera-wajib').style.backgroundColor = "#34c759";
        })
        .catch(err => {
            alert("GAGAL MEMBUKA KAMERA!\n\n1. Pastikan link di atas diawali dengan HTTPS://\n2. Jika di iPhone, buka Pengaturan HP -> Safari -> Kamera -> pilih Izinkan.");
        });
    }

    function onScanSuccess(decodedText) {
        let cleanText = decodedText.trim();
        
        if (cleanText === lastScanned) return;
        lastScanned = cleanText;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { lastScanned = ""; }, 1500);

        // Pisahkan IMEI (15 angka murni)
        if (/^\d{15}$/.test(cleanText)) {
            document.getElementById('imei').value = cleanText;
            vibrateHP();
        } 
        // Pisahkan Serial Number (9-13 alfanumerik)
        else if (cleanText.length >= 9 && cleanText.length <= 13 && !/\s/.test(cleanText)) {
            if (cleanText.toUpperCase().startsWith("S")) {
                cleanText = cleanText.substring(1);
            }
            document.getElementById('sn').value = cleanText;
            vibrateHP();
        }
    }

    function vibrateHP() {
        if (navigator.vibrate) navigator.vibrate(50);
    }

    function simpanData() {
        const nama = document.getElementById('nama').value;
        const sn = document.getElementById('sn').value;
        const imei = document.getElementById('imei').value;

        if (!sn && !imei) return alert("Silakan scan barcode dahulu!");

        dbData.push({ "Nama Barang": nama, "Serial Number": sn, "IMEI": imei });

        const logList = document.getElementById('log-list');
        logList.innerHTML += `<div class="log-item">✓ SN: ${sn || '-'} | IMEI: ${imei || '-'}</div>`;
        logList.scrollTop = logList.scrollHeight;

        document.getElementById('sn').value = '';
        document.getElementById('imei').value = '';
    }

    function unduhExcel() {
        if (dbData.length === 0) return alert("Data antrean kosong!");
        
        const btn = document.getElementById('btnExcel');
        btn.innerText = "Memproses...";
        btn.disabled = true;

        if (window.XLSX) {
            prosesEkspor();
        } else {
            const script = document.createElement('script');
            script.src = "https://jsdelivr.net";
            script.onload = () => { prosesEkspor(); };
            document.head.appendChild(script);
        }
    }

    function prosesEkspor() {
        const ws = XLSX.utils.json_to_sheet(dbData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data Scan");
        XLSX.writeFile(wb, "Data_Scan_iPhone.xlsx");
        
        const btn = document.getElementById('btnExcel');
        btn.innerText = "Unduh Excel";
        btn.disabled = false;
    }
</script>

</body>
</html>
