<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Cepat</title>
    <!-- Hanya memuat library core pendukung via CDN ringan -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; text-align: center; color: #212529; font-size: 18px;}
        
        /* Modul Scanner Ringan */
        #canvas-container {
            width: 100%;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
            aspect-ratio: 4 / 3;
        }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        
        /* Garis Bidik Penyelaras */
        .laser-line {
            position: absolute;
            top: 50%; left: 5%;
            width: 90%; height: 2px;
            background-color: #ff3b30;
            box-shadow: 0 0 8px #ff3b30;
            transform: translateY(-50%);
        }

        .input-box {
            margin-bottom: 10px;
        }
        label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ced4da;
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        input:focus { border-color: #34c759; outline: none; }
        
        .row-btn { display: flex; gap: 8px; margin-top: 15px; }
        button {
            flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-add { background: #34c759; }
        .btn-xl { background: #007aff; }
        
        .log-box {
            margin-top: 15px; max-height: 120px; overflow-y: auto;
            border-top: 1px solid #dee2e6; padding-top: 8px; font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px dashed #f1f3f5; color: #666;}
    </style>
</head>
<body>

<div class="card">
    <h3>Barcode Scanner Ultra-Lite</h3>
    
    <!-- Viewfinder Kamera Kamera -->
    <div id="canvas-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="laser-line"></div>
    </div>

    <div class="input-box">
        <label>Nama Barang</label>
        <input type="text" id="nama" value="iPhone 15 Pink">
    </div>
    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <input type="text" id="sn" placeholder="Arahkan kamera ke kode barcode">
    </div>
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" placeholder="Otomatis terpisah saat terdeteksi">
    </div>

    <div class="row-btn">
        <button class="btn-add" onclick="simpanData()">Simpan Data</button>
        <button class="btn-xl" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#333;">Data Antrean Saat Ini:</strong>
        <div id="log-list"></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvas = canvasElement.getContext('2d', { alpha: false });
    let dbData = [];

    // Konfigurasi kamera yang lebih kompatibel untuk berbagai jenis HP
    const constraints = {
        video: {
            facingMode: "environment", // Mengutamakan kamera belakang
            width: { ideal: 640 },
            height: { ideal: 480 }
        },
        audio: false
    };

    // Hidupkan Kamera HP
    navigator.mediaDevices.getUserMedia(constraints)
    .then(function(stream) {
        video.srcObject = stream;
        // Atribut tambahan wajib untuk browser iOS/Safari & Chrome Mobile
        video.setAttribute("playsinline", true);
        video.setAttribute("autoplay", true);
        video.setAttribute("muted", true);
        
        // Memicu video agar pasti berputar sebelum dibaca Canvas
        video.play().then(() => {
            requestAnimationFrame(tick);
        }).catch(err => {
            console.log("Video play dipaksa jalan:", err);
            requestAnimationFrame(tick);
        });
    })
    .catch(err => {
        alert("Kamera diblokir. Mohon periksa izin kamera di pengaturan browser Anda (Pastikan link ber-HTTPS). Detail: " + err.name);
    });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });
            
            if (code && code.data) {
                prosesBarcode(code.data); // Memperbaiki penamaan fungsi
            }
        }
        setTimeout(() => { requestAnimationFrame(tick); }, 60);
    }

    // LOGIKA AUTO-PARSING (Mengenali jenis Kode otomatis)
    function prosesBarcode(text) {
        let cleanText = text.trim();
        
        // Ciri IMEI: Berisi angka murni berjumlah 15 digit
        if (/^\d{15}$/.test(cleanText)) {
            document.getElementById('imei').value = cleanText;
            vibrateHP();
        } 
        // Ciri Serial Number
        else if (cleanText.length >= 8 && cleanText.length <= 15 && !cleanText.includes(" ")) {
            if(cleanText.toUpperCase().includes("S")) {
               cleanText = cleanText.replace(/[\(S\)\s]/g, '');
            }
            document.getElementById('sn').value = cleanText;
            vibrateHP();
        }
    }

    function vibrateHP() {
        if (navigator.vibrate) navigator.vibrate(50);
    }

    function simpanData() {
        const nama = document.getElementById('nama').value;
        const sn = document.getElementById('sn').value;
        const imei = document.getElementById('imei').value;

        if (!sn && !imei) return alert("Scan barcode terlebih dahulu!");

        dbData.push({ "Nama Barang": nama, "Serial Number": sn, "IMEI": imei });

        const logList = document.getElementById('log-list');
        logList.innerHTML += `<div class="log-item">✓ SN: ${sn || '-'} | IMEI: ${imei || '-'}</div>`;
        logList.scrollTop = logList.scrollHeight;

        document.getElementById('sn').value = '';
        document.getElementById('imei').value = '';
    }

    function unduhExcel() {
        if (dbData.length === 0) return alert("Belum ada data!");
        const ws = XLSX.utils.json_to_sheet(dbData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Data_Scan_iPhone.xlsx");
    }
</script>

</body>
</html>
