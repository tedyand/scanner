<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner to Excel</title>
    <!-- Memuat Library Scanner & Excel via CDN -->
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add { background-color: #28a745; color: white; }
        .btn-add:hover { background-color: #218838; }
        .btn-export { background-color: #007bff; color: white; }
        .btn-export:hover { background-color: #0069d9; }
        
        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #e9ecef;
            color: #495057;
        }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2>Barcode Scanner & Excel Exporter</h2>
    
    <!-- Area Kamera Scanner -->
    <div id="reader"></div>

    <!-- Form Input Data -->
    <div class="form-group">
        <label for="namaBarang">Nama Barang:</label>
        <input type="text" id="namaBarang" value="iPhone 15 Pink">
    </div>
    <div class="form-group">
        <label for="serialNumber">Serial Number (S/N):</label>
        <input type="text" id="serialNumber" placeholder="Scan atau isi manual">
    </div>
    <div class="form-group">
        <label for="imei">IMEI / MEID:</label>
        <input type="text" id="imei" placeholder="Scan atau isi manual">
    </div>

    <div class="button-group">
        <button class="btn-add" onclick="tambahKeTabel()">Simpan ke Tabel</button>
        <button class="btn-export" onclick="eksporKeExcel()">Unduh File Excel</button>
    </div>

    <!-- Tabel Data Sementara -->
    <div class="table-container">
        <h3>Data Terpindai Sementara</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama Barang</th>
                    <th>Serial Number</th>
                    <th>IMEI</th>
                </tr>
            </thead>
            <tbody id="dataTabel">
                <!-- Baris data baru akan muncul di sini -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Menyimpan barisan objek data scan
    let listData = [];
    
    // Identifikasi input aktif untuk menentukan hasil scan masuk ke kolom mana
    let inputAktif = 'serialNumber';

    // Event listener untuk memindahkan fokus deteksi scanner
    document.getElementById('serialNumber').addEventListener('focus', () => inputAktif = 'serialNumber');
    document.getElementById('imei').addEventListener('focus', () => inputAktif = 'imei');

    // Inisialisasi Scanner Kamera Belakang
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 10, 
        qrbox: { width: 250, height: 150 }, // disesuaikan untuk barcode panjang/linear
        aspectRatio: 1.777778
    });

    function onScanSuccess(decodedText, decodedResult) {
        // Memasukkan hasil scan kode ke kolom form yang sedang aktif
        document.getElementById(inputAktif).value = decodedText;
        
        // Otomatis berpindah fokus ke kolom berikutnya agar user tinggal scan beruntun
        if (inputAktif === 'serialNumber') {
            inputAktif = 'imei';
            document.getElementById('imei').focus();
        }
    }

    function onScanFailure(error) {
        // Kegagalan pencarian frame (diabaikan agar performa tetap lancar)
    }

    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    // Fungsi menyimpan input form ke list array & tabel preview
    function tambahKeTabel() {
        const nama = document.getElementById('namaBarang').value;
        const sn = document.getElementById('serialNumber').value;
        const imei = document.getElementById('imei').value;

        if(!sn && !imei) {
            alert("Mohon isi Serial Number atau IMEI terlebih dahulu!");
            return;
        }

        const dataBaru = {
            "Nama Barang": nama,
            "Serial Number": sn,
            "IMEI": imei
        };

        listData.push(dataBaru);

        // Memperbarui UI Tabel HTML
        const tbody = document.getElementById('dataTabel');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${nama}</td><td>${sn}</td><td>${imei}</td>`;
        tbody.appendChild(tr);

        // Reset kolom input scan agar siap untuk perangkat berikutnya
        document.getElementById('serialNumber').value = '';
        document.getElementById('imei').value = '';
        inputAktif = 'serialNumber';
        document.getElementById('serialNumber').focus();
    }

    // Fungsi memproses konversi Array Data menjadi File Excel .xlsx asli
    function eksporKeExcel() {
        if(listData.length === 0) {
            alert("Belum ada data untuk diekspor!");
            return;
        }

        // Membuat objek sheet dari data JSON
        const worksheet = XLSX.utils.json_to_sheet(listData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Scan Perangkat");

        // Membuat file excel dan otomatis terunduh di browser lokal pengguna
        XLSX.writeFile(workbook, "Data_Scan_Barcode_iPhone.xlsx");
    }
</script>

</body>
</html>
