<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Barcode iPhone</title>
    <!-- Memuat Pustaka Scanner Terstabil dari Server Global -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; text-align: center; color: #212529; font-size: 16px;}
        
        /* Area Kotak Kamera Bawaan Library */
        #reader {
            width: 100%;
            background: #fafafa;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #bbb !important;
            margin-bottom: 15px;
        }
        /* Mempercantik tombol bawaan library agar mudah di-klik */
        #reader button {
            background-color: #007aff;
            color: white;
            padding: 8px 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            margin: 10px auto;
            display: block;
            cursor: pointer;
        }
        #reader img { display: none; } /* Hilangkan gambar ikon bawaan */

        .input-box { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #495057; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ced4da;
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        
        .row-btn { display: flex; gap: 8px; margin-top: 15px; }
        button.action-btn {
            flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-add { background: #34c759; }
        .btn-xl { background: #007aff; }
        
        .log-box {
            margin-top: 15px; max-height: 100px; overflow-y: auto;
            border-top: 1px solid #dee2e6; padding-top: 8px; font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px dashed #f1f3f5; color: #666;}
    </style>
</head>
<body>

<div class="card">
    <h3>Barcode Scanner Ultra Fail-Safe</h3>
    
    <!-- Modul Kamera Utama Pustaka Resmi -->
    <div id="reader"></div>

    <div class="input-box">
        <label>Nama Barang</label>
        <input type="text" id="nama" value="iPhone 15 Pink">
    </div>
    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <input type="text" id="sn" placeholder="Hasil scan barcode ke-1">
    </div>
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" placeholder="Hasil scan barcode ke-2">
    </div>

    <div class="row-btn">
        <button class="action-btn btn-add" onclick="simpanData()">Simpan Data</button>
        <button class="action-btn btn-xl" id="btnExcel" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#333;">Antrean Data Saat Ini:</strong>
        <div id="log-list"></div>
    </div>
</div>

<script>
    let dbData = [];
    let lastScanned = "";
    let debounceTimer;

    // 1. DAFTARKAN MESIN DECODER KHUSUS KODE BARCODE GARIS BOX IPHONE
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 15,
        qrbox: { width: 300, height: 120 }, // Dimensi horizontal ideal untuk barcode garis
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.CODE_128, 
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.EAN_13
        ],
        rememberLastUsedCamera: true,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    }, false);

    // Jalankan render scanner
    html5QrcodeScanner.render(onScanSuccess);

    // 2. FUNGSI MENANGKAP DAN MEMISAHKAN DATA BARCODE SECARA OTOMATIS
    function onScanSuccess(decodedText) {
        let cleanText = decodedText.trim();
        
        // Kunci pembacaan ganda dalam waktu singkat
        if (cleanText === lastScanned) return;
        lastScanned = cleanText;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { lastScanned = ""; }, 1500);

        // A. Filter IMEI (15 digit angka murni)
        if (/^\d{15}$/.test(cleanText)) {
            document.getElementById('imei').value = cleanText;
            vibrateHP();
        } 
        // B. Filter Serial Number iPhone (9 sampai 13 karakter huruf & angka)
        else if (cleanText.length >= 9 && cleanText.length <= 13 && !/\s/.test(cleanText)) {
            if (cleanText.toUpperCase().startsWith("S")) {
                cleanText = cleanText.substring(1);
            }
            document.getElementById('sn').value = cleanText;
            vibrateHP();
        }
    }

    function vibrateHP() {
        if (navigator.vibrate) navigator.vibrate(60);
    }

    function simpanData() {
        const nama = document.getElementById('nama').value;
        const sn = document.getElementById('sn').value;
        const imei = document.getElementById('imei').value;

        if (!sn && !imei) return alert("Silakan scan barcode dahulu!");

        dbData.push({ "Nama Barang": nama, "Serial Number": sn, "IMEI": imei });

        const logList = document.getElementById('log-list');
        logList.innerHTML += `<div class="log-item">✓ SN: ${sn || '-'} | IMEI: ${imei || '-'}</div>`;
        logList.scrollTop = logList.scrollHeight;

        document.getElementById('sn').value = '';
        document.getElementById('imei').value = '';
    }

    // Lazy Loading Pustaka Excel (Web tetap dibuka dengan kilat dan hemat RAM HP)
    function unduhExcel() {
        if (dbData.length === 0) return alert("Belum ada data di antrean!");
        
        const btn = document.getElementById('btnExcel');
        btn.innerText = "Memproses...";
        btn.disabled = true;

        if (window.XLSX) {
            prosesEkspor();
        } else {
            const script = document.createElement('script');
            script.src = "https://jsdelivr.net";
            script.onload = () => { prosesEkspor(); };
            document.head.appendChild(script);
        }
    }

    function prosesEkspor() {
        const ws = XLSX.utils.json_to_sheet(dbData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data Scan");
        XLSX.writeFile(wb, "Data_Scan_iPhone.xlsx");
        
        const btn = document.getElementById('btnExcel');
        btn.innerText = "Unduh Excel";
        btn.disabled = false;
    }
</script>

</body>
</html>
