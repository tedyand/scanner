<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Ultra Stabil</title>
    <!-- Memuat Library Core (Ringan & Stabil) -->
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h3 { margin-top: 0; text-align: center; color: #212529; font-size: 18px;}
        
        /* Viewfinder Scanner menggunakan HTML element asli */
        #scanner-view {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
            aspect-ratio: 4 / 3;
            border: 2px solid #ddd;
        }

        .input-box { margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ced4da;
            border-radius: 6px; box-sizing: border-box; font-size: 15px;
        }
        input:focus { border-color: #007aff; outline: none; }
        
        .row-btn { display: flex; gap: 8px; margin-top: 15px; }
        button {
            flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        .btn-add { background: #34c759; }
        .btn-xl { background: #007aff; }
        
        .log-box {
            margin-top: 15px; max-height: 120px; overflow-y: auto;
            border-top: 1px solid #dee2e6; padding-top: 8px; font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px dashed #f1f3f5; color: #666;}
        
        /* Hilangkan elemen bawaan tombol default library agar UI bersih */
        #scanner-view button, #scanner-view span { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h3>Barcode Scanner Native Camera</h3>
    
    <!-- Area Kamera Utama -->
    <div id="scanner-view"></div>

    <div class="input-box">
        <label>Nama Barang</label>
        <input type="text" id="nama" value="iPhone 15 Pink">
    </div>
    <div class="input-box">
        <label>Serial Number (S/N)</label>
        <input type="text" id="sn" placeholder="Arahkan kamera ke barcode...">
    </div>
    <div class="input-box">
        <label>IMEI / MEID</label>
        <input type="text" id="imei" placeholder="Otomatis memisahkan kode...">
    </div>

    <div class="row-btn">
        <button class="btn-add" onclick="simpanData()">Simpan Data</button>
        <button class="btn-xl" onclick="unduhExcel()">Unduh Excel</button>
    </div>

    <div class="log-box">
        <strong style="font-size:12px; color:#333;">Data Tersimpan Sementara:</strong>
        <div id="log-list"></div>
    </div>
</div>

<script>
    let dbData = [];
    let lastScannedCode = "";
    let scanTimeout;

    // Inisialisasi Engine Scanner Utama
    const html5QrCode = new Html5Qrcode("scanner-view");

    // Menjalankan Kamera Belakang dengan konfigurasi stabil browser HP
    html5QrCode.start(
        { facingMode: "environment" }, // Memaksa penggunaan kamera belakang perangkat
        {
            fps: 15, // Frame Rate optimal agar HP tidak panas
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                // Membuat kotak bidik memanjang horizontal khusus linear barcode box iPhone
                return { width: Math.floor(viewfinderWidth * 0.85), height: Math.floor(viewfinderHeight * 0.4) };
            },
            aspectRatio: 1.333333
        },
        onScanSuccess
    ).catch(err => {
        alert("Inisialisasi kamera gagal. Pastikan link diawali https:// dan tab penyamaran digunakan untuk menghindari cache. Detail: " + err);
    });

    // Aksi ketika Barcode sukses ditangkap kamera
    function onScanSuccess(decodedText) {
        let cleanText = decodedText.trim();
        
        // Proteksi debouncing agar kode tidak terbaca berulang-ulang dalam satu detik
        if (cleanText === lastScannedCode) return;
        lastScannedCode = cleanText;
        clearTimeout(scanTimeout);
        scanTimeout = setTimeout(() => { lastScannedCode = ""; }, 1500);

        // 1. Logika Parsing IMEI: Berisi 15 digit angka murni
        if (/^\d{15}$/.test(cleanText)) {
            document.getElementById('imei').value = cleanText;
            vibrateHP();
        } 
        // 2. Logika Parsing Serial Number: Alfanumerik sepanjang 10-12 digit (Contoh: HJZXJP96MM)
        else if (cleanText.length >= 9 && cleanText.length <= 13 && !/\s/.test(cleanText)) {
            // Hilangkan prefiks "(S)" jika ikut terbaca oleh kamera scanner
            if (cleanText.toUpperCase().startsWith("S")) {
                cleanText = cleanText.substring(1);
            }
            document.getElementById('sn').value = cleanText;
            vibrateHP();
        }
    }

    function vibrateHP() {
        if (navigator.vibrate) navigator.vibrate(60); // Efek getar balik di HP Android
    }

    function simpanData() {
        const nama = document.getElementById('nama').value;
        const sn = document.getElementById('sn').value;
        const imei = document.getElementById('imei').value;

        if (!sn && !imei) return alert("Belum ada data barcode yang terscan!");

        dbData.push({ "Nama Barang": nama, "Serial Number": sn, "IMEI": imei });

        // Tampilkan daftar antrean sementara di bawah form
        const logList = document.getElementById('log-list');
        logList.innerHTML += `<div class="log-item">✓ SN: ${sn || '-'} | IMEI: ${imei || '-'}</div>`;
        logList.scrollTop = logList.scrollHeight;

        // Reset input barcode agar siap untuk perangkat iPhone berikutnya
        document.getElementById('sn').value = '';
        document.getElementById('imei').value = '';
    }

    function unduhExcel() {
        if (dbData.length === 0) return alert("Belum ada data untuk diekspor!");
        const ws = XLSX.utils.json_to_sheet(dbData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data Scan");
        XLSX.writeFile(wb, "Hasil_Scan_iPhone.xlsx");
    }
</script>

</body>
</html>
