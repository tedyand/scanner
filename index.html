<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Barang Ke Excel (Murni Offline)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { padding: 15px; background-color: #f4f6f9; color: #333; }
        h2 { text-align: center; margin-bottom: 15px; color: #2c3e50; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-top: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn { width: 100%; padding: 14px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-excel { background-color: #27ae60; margin-top: 20px; }
        .table-container { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Input & Scan Barang</h2>

    <!-- Form Input Data Barang -->
    <div class="form-group">
        <label for="barcode-res">Kode Barang / Barcode:</label>
        <!-- Di HP, saat kolom ini diketuk, Anda bisa memanfaatkan tombol scanner bawaan keyboard HP Anda (jika ada) -->
        <input type="text" id="barcode-res" placeholder="Ketik angka barcode di sini...">
    </div>
    
    <div class="form-group">
        <label for="nama-barang">Nama Barang:</label>
        <input type="text" id="nama-barang" placeholder="Masukkan nama barang...">
    </div>

    <div class="form-group">
        <label for="jumlah-barang">Jumlah (Qty):</label>
        <input type="number" id="jumlah-barang" value="1" min="1">
    </div>

    <button class="btn" onclick="tambahBarang()">Simpan Data</button>
    <button class="btn btn-excel" onclick="unduhExcel()">Download Data ke Excel</button>

    <!-- Tabel Riwayat Scan -->
    <div class="table-container">
        <h3>Daftar Barang</h3>
        <table id="tabel-barang">
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Kode</th>
                    <th>Nama</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // Array penampung data
    let dataBarang = [];

    // Fungsi Tambah Data ke Tabel
    function tambahBarang() {
        const kode = document.getElementById('barcode-res').value.trim();
        const nama = document.getElementById('nama-barang').value.trim();
        const qty = document.getElementById('jumlah-barang').value.trim();
        const waktu = new Date().toLocaleString('id-ID');

        if (!kode || !nama) {
            alert('Kode barang dan Nama barang tidak boleh kosong!');
            return;
        }

        // Simpan ke memory
        dataBarang.push({ waktu, kode, nama, qty });

        // Update Tabel HTML
        const tbody = document.querySelector('#tabel-barang tbody');
        const row = `<tr><td>${waktu}</td><td>${kode}</td><td>${nama}</td><td>${qty}</td></tr>`;
        tbody.insertAdjacentHTML('beforeend', row);

        // Reset Input
        document.getElementById('barcode-res').value = '';
        document.getElementById('nama-barang').value = '';
        document.getElementById('jumlah-barang').value = '1';
        
        // Kembalikan fokus ke kolom barcode biar siap input lagi
        document.getElementById('barcode-res').focus();
    }

    // Fungsi Export Excel (Format CSV Murni Tanpa Library)
    function unduhExcel() {
        if (dataBarang.length === 0) {
            alert('Belum ada data barang yang dimasukkan!');
            return;
        }

        // Membuat struktur text CSV (dipisahkan oleh koma)
        let csvContent = "Waktu,Kode Barang,Nama Barang,Jumlah (Qty)\n";
        
        dataBarang.forEach(item => {
            csvContent += `"${item.waktu}","${item.kode}","${item.nama}","${item.qty}"\n`;
        });

        // Proses download file otomatis di HP / Laptop
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "Data_Barang_Scan.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
